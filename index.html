<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRAKIFY — Daily Command</title>
    <!-- Editorial Typography: Playfair Display + Space Grotesk + Plus Jakarta Sans + Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="text-espresso-800 dark:text-ivory-100 font-sans antialiased min-h-screen selection:bg-terracotta-100 selection:text-terracotta-700 dark:selection:bg-terracotta-900/50 dark:selection:text-terracotta-200 transition-colors duration-200">
    <svg aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;overflow:hidden">
      <defs>
        <filter id="paper-ink-press" x="-12%" y="-24%" width="124%" height="148%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="2" seed="8" result="paperGrain" />
          <feDisplacementMap in="SourceGraphic" in2="paperGrain" scale="1.15" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="paper-mark-press" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="2" seed="8" result="paperGrain" />
          <feDisplacementMap in="SourceGraphic" in2="paperGrain" scale="1.25" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
